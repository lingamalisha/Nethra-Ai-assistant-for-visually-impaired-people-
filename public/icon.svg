<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#FACC15" stroke-width="6" opacity="0.4"/>
  
  <!-- Outer Sonic / Wave Arc Left & Right -->
  <path d="M 120 180 A 180 180 0 0 0 120 332" fill="none" stroke="#FACC15" stroke-width="20" stroke-linecap="round"/>
  <path d="M 392 180 A 180 180 0 0 1 392 332" fill="none" stroke="#FACC15" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Inner Wave Arcs -->
  <path d="M 160 210 A 120 120 0 0 0 160 302" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M 352 210 A 120 120 0 0 1 352 302" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>

  <!-- Stylized Vision Eye / Lens Contour -->
  <path d="M 180 256 Q 256 160 332 256 Q 256 352 180 256 Z" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Center Pupil / AI Core Aperture -->
  <circle cx="256" cy="256" r="44" fill="#FACC15"/>
  <circle cx="256" cy="256" r="22" fill="#0A0A0C"/>
  <circle cx="266" cy="246" r="7" fill="#FFFFFF"/>
  
  <!-- Tactile Haptic Pulses -->
  <circle cx="256" cy="110" r="14" fill="#FACC15"/>
  <circle cx="256" cy="402" r="14" fill="#FACC15"/>
</svg>
